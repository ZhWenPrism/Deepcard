[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcard-research"
version = "0.1.0"
description = "DeepCard multi-task cardiac interpretation research utilities"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "DeepCard/LICENSE" }
authors = [{ name = "Zhihong Wen" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["DeepCard*"]
