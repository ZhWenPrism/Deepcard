name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-utilities:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile public utilities
        run: python -m compileall -q DeepCard/datasets DeepCard/evaluation DeepCard/reporting
      - name: Run utility tests
        run: python -m unittest discover -s DeepCard/tests -v

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r DeepCard/requirements.txt
      - name: Run runtime tests
        run: python -m unittest discover -s DeepCard/tests/runtime -v
